# The live session user's home, filled from /usr/share/telamon-installer-session
# at every boot: the installer starts full-screen in a Plasma session with no
# panel, no screen lock, no wallet and only the accessibility shortcuts, like
# plasma-setup's session. Not /run/telamon-installer, which is the helper's.
# The home is root's until the copy is done: tmpfiles refuses to go from a
# user's folder into root's.
d /run/telamon-installer-session 0750 - - -
C /run/telamon-installer-session/.config - - - - /usr/share/telamon-installer-session/config
Z /run/telamon-installer-session - telamon-installer telamon-installer - -
# Again for .config itself: its line sorts after the home's.
Z /run/telamon-installer-session/.config - telamon-installer telamon-installer - -
