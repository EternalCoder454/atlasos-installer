[workspace]
resolver = "3"
members = ["crates/installer-core", "helper"]
# The UI needs Qt to build, which the host lacks: it is its own workspace,
# built and tested in the container (app/dev.sh).
exclude = ["app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-installer"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# Root code: an arithmetic overflow is a panic, never a silent wrap (docs/SECURITY.md,
# "Build hardening").
overflow-checks = true
