[package]
name = "telamon-installer"
description = "Telamon Installer: the Telamon OS installer UI (Kirigami over CXX-Qt)"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-installer"
publish = false
rust-version = "1.89"
build = "build.rs"

# Not part of the repo's workspace: it needs Qt to build (see app/dev.sh).
[workspace]

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_installer"
crate-type = ["staticlib", "rlib"]

[dependencies]
installer-core = { path = "../crates/installer-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
