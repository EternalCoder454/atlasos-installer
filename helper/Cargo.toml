[package]
name = "telamon-installer-helper"
description = "Privileged D-Bus helper that installs Telamon OS for Telamon Installer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "telamon-installer-helper"
path = "src/main.rs"

[dependencies]
installer-core = { path = "../crates/installer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
getrandom = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[dev-dependencies]
tempfile = "3"
